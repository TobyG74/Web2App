plugins {
    id "com.android.application"
}

android {
    namespace "__PACKAGE_NAME__"
    compileSdk 34

    defaultConfig {
        applicationId "__PACKAGE_NAME__"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
