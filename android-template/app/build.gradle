plugins {
    id "com.android.application"
}

android {
    namespace "__PACKAGE_NAME__"
    compileSdk 34

    defaultConfig {
        applicationId "__PACKAGE_NAME__"
        minSdk 21
        targetSdk 34
        versionCode __VERSION_CODE__
        versionName "__VERSION_NAME__"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
