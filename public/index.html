<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web2App Converter</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f0e6; --card: #fffdf7; --line: #202020; --fg: #202020; --mut: #50504a;
    --accent: #ffe253; --ok: #22633c; --err: #a32720;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: var(--fg);
    background: var(--bg); line-height: 1.5;
    display: grid; place-items: center; padding: 3rem 1.25rem;
  }
  .card {
    width: 100%; max-width: 30rem; min-width: 0; background: var(--card); overflow-wrap: anywhere;
    border: 3px solid var(--line); box-shadow: 10px 10px 0 var(--line);
  }
  .intro { padding: 1.25rem 1.5rem; background: var(--accent); border-bottom: 3px solid var(--line); }
  h1 { margin: 0 0 .45rem; font-size: clamp(1.65rem, 5vw, 2rem); font-weight: 900; line-height: 1.1; letter-spacing: -.045em; }
  .sub { margin: 0; max-width: 30rem; font-size: .95rem; }
  form { padding: 1.25rem 1.5rem 0; }
  label, legend { display: block; font-size: .85rem; font-weight: 700; margin: 0 0 .45rem; }
  .field { margin: 0 0 1rem; min-width: 0; }
  fieldset.field { padding: 0; border: 0; }
  legend { padding: 0; }
  input[type=url], input[type=text] {
    width: 100%; min-width: 0; min-height: 44px; padding: .6rem .75rem;
    border-radius: 0; border: 2px solid var(--line); background: #fff; color: var(--fg); font: inherit;
  }
  input::placeholder { color: var(--mut); opacity: 1; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--line); outline-offset: 4px; }
  .iconrow { display: flex; align-items: center; gap: .8rem; }
  .preview {
    width: 56px; height: 56px; border: 2px solid var(--line);
    background: var(--bg); flex: none; display: grid; place-items: center;
    color: var(--mut); font-size: .75rem; font-weight: 700; overflow: hidden;
  }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  .iconbtns { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; min-width: 0; }
  .mini { font-size: .78rem; color: var(--mut); overflow-wrap: anywhere; }
  .plats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .plat {
    border: 2px solid var(--line); margin: 0; min-height: 60px; padding: .55rem .7rem; cursor: pointer;
    display: flex; gap: .65rem; align-items: center; font-size: .95rem; background: #fff;
  }
  .plat input, .check input { accent-color: var(--fg); width: 18px; height: 18px; flex: none; }
  .plat:has(input:checked) { background: var(--accent); box-shadow: 3px 3px 0 var(--line); }
  .plat:has(input:focus-visible) { outline: 3px solid var(--line); outline-offset: 4px; }
  .plat small { display: block; color: var(--mut); font-size: .75rem; font-weight: 400; }
  .plat span { min-width: 0; }
  button.go {
    width: 100%; min-height: 48px; margin-top: .35rem; padding: .65rem 1rem;
    border: 2px solid var(--line); border-radius: 0; cursor: pointer;
    font: inherit; font-weight: 800; color: var(--fg); background: var(--accent);
    box-shadow: 5px 5px 0 var(--line); transition: transform .12s, box-shadow .12s;
  }
  button.go:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
  button.go:disabled { background: var(--bg); color: var(--mut); box-shadow: none; cursor: wait; }
  .filebtn {
    min-height: 44px; padding: .5rem .75rem; border: 2px solid var(--line); border-radius: 0;
    font: inherit; font-size: .8rem; font-weight: 700; color: var(--fg); background: #fff;
    cursor: pointer; text-align: left; overflow-wrap: anywhere;
  }
  .filebtn:active { background: var(--accent); }
  #status { margin: .85rem 1.5rem 0; min-height: 1.5rem; font-size: .85rem; overflow-wrap: anywhere; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  .check { display: flex; gap: .7rem; align-items: flex-start; margin: 0; min-height: 44px; cursor: pointer; font-size: .9rem; }
  .check input { margin: .15rem 0 0; }
  .check small { display: block; color: var(--mut); font-size: .78rem; font-weight: 400; margin-top: .25rem; }
  .credit {
    margin-top: .85rem; padding: .75rem 1.5rem; border-top: 2px solid var(--line);
    background: var(--bg); text-align: center; font-size: .78rem; color: var(--mut);
  }
  .credit a { display: inline-flex; align-items: center; min-height: 44px; color: var(--fg); text-underline-offset: 3px; }
  .credit .repo {
    gap: .5rem; margin-bottom: .35rem; padding: .5rem .8rem; border: 2px solid var(--line);
    background: #fff; font-weight: 700; text-decoration: none;
  }
  @media (hover: hover) {
    button.go:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--line); }
    .filebtn:hover, .credit .repo:hover { background: var(--accent); }
    .plat:hover { background: var(--bg); }
    .plat:has(input:checked):hover { background: var(--accent); }
  }
  @media (max-width: 480px) {
    body { padding: 1.25rem .9rem; }
    .card { box-shadow: 6px 6px 0 var(--line); }
    .intro { padding: 1.25rem; }
    form { padding: 1.25rem 1.25rem 0; }
    #status { margin-inline: 1.25rem; }
    .credit { padding: .75rem 1.25rem; }
  }
  @media (max-width: 360px) {
    .plats { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    button.go { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <header class="intro">
    <h1>Web2App Converter</h1>
    <p class="sub">Tempel URL, dapat aplikasi jadi. Nama & icon otomatis dari situs, bisa diganti.</p>
    </header>

    <form id="f">
      <div class="field">
        <label for="url">URL website</label>
        <input id="url" type="url" placeholder="https://situskamu.com" required />
      </div>

      <div class="field">
        <label for="name">Nama aplikasi</label>
        <input id="name" type="text" placeholder="otomatis dari judul situs" />
      </div>

      <div class="field">
        <label for="iconfile">Icon</label>
        <div class="iconrow">
          <div class="preview" id="preview">auto</div>
          <div class="iconbtns">
            <button type="button" class="filebtn" id="pick">Pilih file icon…</button>
            <button type="button" class="filebtn" id="clear" hidden>Pakai icon situs (auto)</button>
            <span class="mini">Kosongkan = favicon situs</span>
          </div>
          <input id="iconfile" type="file" accept="image/*" hidden />
        </div>
      </div>

      <div class="field" id="pkgField" hidden>
        <label for="pkg">Package name (Android)</label>
        <input id="pkg" type="text" placeholder="com.perusahaanmu.namaapp" />
        <span class="mini">Kosongkan = com.html2exe.webapp</span>
      </div>

      <fieldset class="field">
        <legend>Platform</legend>
        <div class="plats">
          <label class="plat"><input type="radio" name="p" value="windows" checked /> <span>Windows<small>.exe (zip)</small></span></label>
          <label class="plat"><input type="radio" name="p" value="linux" /> <span>Linux<small>AppImage/zip</small></span></label>
          <label class="plat"><input type="radio" name="p" value="mac" /> <span>macOS<small>unsigned</small></span></label>
          <label class="plat"><input type="radio" name="p" value="apk" /> <span>Android<small>.apk</small></span></label>
        </div>
      </fieldset>

      <div class="field" id="singleField">
        <label class="check">
          <input id="single" type="checkbox" checked />
          <span>Satu file .exe saja<small>Bundel semua .dll/.pak jadi 1 .exe portable (dikirim dalam zip). Build lebih lama.</small></span>
        </label>
      </div>

      <button class="go" id="go" type="submit">Build & Download</button>
    </form>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <footer class="credit">
      <a class="repo" href="https://github.com/TobyG74/Web2App" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        Source code di GitHub
      </a>
      <div>
        Dibuat oleh <strong>Tobz</strong> ·
        <a href="https://github.com/TobyG74" target="_blank" rel="noopener">@TobyG74</a> ·
        <a href="https://instagram.com/ini.tobz" target="_blank" rel="noopener">IG @ini.tobz</a>
      </div>
    </footer>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const f = $("f"), status = $("status"), go = $("go"), preview = $("preview");
let iconDataUrl = null;

function updatePkgVisibility() {
  $("pkgField").hidden = f.p.value !== "apk";
  $("singleField").hidden = f.p.value !== "windows"; // portable target is Windows-only
}
f.querySelectorAll('input[name="p"]').forEach((r) => r.addEventListener("change", updatePkgVisibility));
updatePkgVisibility();

// live favicon preview from the typed URL (default icon)
function autoIcon() {
  if (iconDataUrl) return;
  try {
    const host = new URL($("url").value).hostname;
    preview.innerHTML = `<img src="https://www.google.com/s2/favicons?sz=128&domain=${host}" alt="" />`;
  } catch { preview.innerHTML = "auto"; }
}
$("url").addEventListener("input", autoIcon);

$("pick").addEventListener("click", () => $("iconfile").click());
$("iconfile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    iconDataUrl = rd.result;
    preview.innerHTML = `<img src="${iconDataUrl}" alt="" />`;
    $("clear").hidden = false;
  };
  rd.readAsDataURL(file);
});
$("clear").addEventListener("click", () => {
  iconDataUrl = null; $("iconfile").value = ""; $("clear").hidden = true; autoIcon();
});

function fail(msg) {
  status.className = "err"; status.textContent = "Gagal: " + msg; go.disabled = false;
}

// Poll job status. Short requests, so a proxy timeout can't kill it, and a few
// transient network errors are tolerated instead of failing the whole build.
function poll(id) {
  let misses = 0;
  const tick = async () => {
    try {
      const r = await fetch(`/api/build/${id}`);
      if (r.status === 404) return fail("Job kedaluwarsa, coba lagi.");
      const s = await r.json();
      misses = 0;
      if (s.status === "queued") {
        status.className = ""; status.textContent = `Menunggu antrian (posisi ${s.position})…`;
      } else if (s.status === "building") {
        status.className = ""; status.textContent = "Building… 1–5 menit. Tab boleh ditinggal.";
      } else if (s.status === "done") {
        status.className = "ok"; status.textContent = "Selesai ✓ mengunduh…";
        const a = document.createElement("a");
        a.href = `/api/build/${id}/download`; a.download = s.name || "app"; a.click();
        go.disabled = false;
        return; // stop polling
      } else if (s.status === "error") {
        return fail(s.error || "Build gagal.");
      }
    } catch {
      if (++misses > 5) return fail("Koneksi terputus. Cek jaringan lalu coba lagi.");
    }
    setTimeout(tick, 2500);
  };
  tick();
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true; status.className = "";
  status.textContent = "Mengirim permintaan…";
  try {
    const r = await fetch("/api/build", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: $("url").value, platform: f.p.value,
        name: $("name").value, iconDataUrl, singleFile: $("single").checked,
        packageName: $("pkg").value,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || r.statusText);
    poll(data.id);
  } catch (err) {
    fail(err.message);
  }
});
</script>
</body>
</html>
